<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semitone — 和弦進行產生器</title>
<style>
  :root {
    --bg: #f4f2f7; --panel: #ffffff; --ink: #24212e; --muted: #6b6779; --line: #dcd8e6;
    --accent: #6a5acd; --accent-ink: #ffffff; --soft: #ece9f5;
    --d2: #e8718d; --d3: #4fb86b; --d4: #9a7be0; --d5: #e0a020;
    --ok: #2f8f55; --warn: #b7791f; --bad: #c2453d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1b26; --panel: #2a2736; --ink: #ece9f5; --muted: #a39fb5; --line: #413d52;
      --accent: #9d8ff5; --accent-ink: #1d1b26; --soft: #353146;
      --ok: #6fd092; --warn: #e8b660; --bad: #f08a82;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .star { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; text-decoration: none;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 600; }
  .star:hover, .star:focus-visible { border-color: var(--accent); outline: none; }
  .star .ico { color: #e3b341; font-size: 15px; line-height: 1; }
  .star .count { padding: 0 7px; border-radius: 99px; background: var(--soft); font-variant-numeric: tabular-nums; font-weight: 500; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--panel); }
  .lang button { border: 0; border-radius: 0; padding: 5px 13px; font-size: 13px; background: transparent; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .sub { color: var(--muted); margin: 4px 0 20px; max-width: 70ch; }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=range] { width: 100%; }
  select, input[type=number] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 8px; }
  input[type=number] { width: 100%; }
  .sig { display: flex; align-items: center; gap: 8px; }
  .sig span { font-size: 18px; color: var(--muted); }
  .help { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 5px;
    border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font: 600 11px/1 system-ui, sans-serif;
    cursor: help; vertical-align: middle; user-select: none; flex: none; }
  .help:hover, .help:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); outline: none; }
  #tip { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 16px)); padding: 9px 12px; border-radius: 10px;
    background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.55; box-shadow: 0 6px 20px rgb(0 0 0 / .25);
    pointer-events: none; white-space: pre-line; }
  #tip[hidden] { display: none; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; max-width: 90ch; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
  .checks label { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 14px; color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 8px; align-items: center; }
  .actions.playrow { margin-top: 0; }
  .actions .spacer { flex: 1; }
  .actions .kbd { color: var(--muted); font-size: 12.5px; }
  .actions label.inline { margin: 0; font-size: 13px; }
  .actions select { width: auto; max-width: 100%; padding: 9px 8px; border-radius: 10px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 9px 18px; cursor: pointer;
    background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .timeline { position: sticky; top: 0; z-index: 5; margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 10px 4px; overflow-x: auto; box-shadow: 0 4px 14px rgb(0 0 0 / .08); }
  .timeline svg { display: block; width: 100%; height: auto; max-height: 190px; }
  .timeline .rowlab { font: 12px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .timeline .grid { stroke: var(--line); stroke-width: 1; }
  .timeline .home { stroke: var(--muted); stroke-dasharray: 3 4; }
  .timeline .path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .timeline .node { cursor: pointer; }
  .timeline .node rect { fill: var(--soft); stroke: var(--line); stroke-width: 1.2; }
  .timeline .node.cra rect { stroke: var(--d3); } .timeline .node.crana rect { stroke: var(--d5); } .timeline .node.pat rect { stroke: var(--d2); }
  .timeline .node text { font: 600 13px ui-monospace, Menlo, monospace; fill: var(--ink); text-anchor: middle; }
  .timeline .node.sel rect { stroke: var(--accent); stroke-width: 2.4; }
  .timeline .node.playing rect { fill: var(--accent); stroke: var(--accent); }
  .timeline .node.na rect { stroke: var(--d4); }
  /* 播放中的反白跟著外框顏色：原形用主題色，ᴗ 綠、ɣ 橘、挟み打ち 粉紅、na 紫 */
  .timeline .node.cra.playing rect { fill: var(--d3); stroke: var(--d3); }
  .timeline .node.crana.playing rect { fill: var(--d5); stroke: var(--d5); }
  .timeline .node.pat.playing rect { fill: var(--d2); stroke: var(--d2); }
  .timeline .node.na.playing rect { fill: var(--d4); stroke: var(--d4); }
  .timeline .node.cra.playing text, .timeline .node.crana.playing text, .timeline .node.pat.playing text, .timeline .node.na.playing text { fill: #1d1b26; }
  .custom { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .custom[hidden] { display: none; }
  .customrow { display: flex; gap: 8px; }
  .customrow input { flex: 1; min-width: 0; font: 15px ui-monospace, Menlo, monospace; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .custom .msg { margin: 6px 0 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .custom .msg.bad { color: var(--bad); }
  .used { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .timeline .n12 { cursor: text; }
  .timeline svg { user-select: none; -webkit-user-select: none; }
  .timeline .node { touch-action: pan-x; } /* 上下拖曳交給我們處理，左右仍可捲動 */
  body.tl-dragging, body.tl-dragging .timeline .node { cursor: ns-resize; }
  .tl-menu { position: absolute; z-index: 6; width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    color: var(--accent-ink); border: 1.5px solid var(--panel); display: flex; align-items: center; justify-content: center;
    font: 700 11px/1 system-ui, sans-serif; }
  .tl-menu:hover, .tl-menu:focus-within { border-color: var(--ink); }
  .tl-menu select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; padding: 0; border: 0; }
  .tl-edit { position: absolute; z-index: 6; width: 92px; height: 26px; padding: 2px 6px; text-align: center;
    font: 600 13px ui-monospace, Menlo, monospace; color: var(--ink); background: var(--bg);
    border: 2px solid var(--accent); border-radius: 7px; outline: none; }
  .tl-edit.bad { border-color: var(--bad); animation: tl-shake .25s; }
  @keyframes tl-shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { .tl-edit.bad { animation: none; } }
  .timeline .swapbtn { cursor: pointer; }
  .timeline .swapbtn circle { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; }
  .timeline .swapbtn text { fill: var(--accent-ink); font: 700 12px system-ui, sans-serif; text-anchor: middle; pointer-events: none; }
  .timeline .swapbtn:hover circle, .timeline .swapbtn:focus-visible circle { stroke: var(--ink); }
  .timeline .swapbtn:focus-visible { outline: none; }
  .timeline .node.playing text { fill: var(--accent-ink); }
  .timeline .n12 { font: 12px system-ui, sans-serif; fill: var(--muted); text-anchor: middle; }
  .timeline .num { font: 10px system-ui, sans-serif; fill: var(--muted); text-anchor: middle; }
  .timeline #ph { stroke: var(--accent); stroke-width: 2; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px; margin-top: 14px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; scroll-margin-top: 220px;
    transition: border-color .15s, box-shadow .15s; }
  .card.playing { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .card > summary { display: flex; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; font-weight: 400; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary::after { content: "▸"; color: var(--muted); margin-left: 2px; transition: transform .15s; }
  .card[open] > summary::after { transform: rotate(90deg); }
  .card .sumtxt { flex: 1; min-width: 0; }
  .card .body { padding: 0 14px 14px; }
  .aud { flex: none; padding: 6px 11px; border-radius: 99px; }
  .subs { margin-top: 10px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .subs .k { color: var(--muted); }
  .subs button { padding: 3px 10px; border-radius: 99px; font: 600 13px ui-monospace, Menlo, monospace; }
  .subs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .subs .n12s { font: 400 11.5px system-ui, sans-serif; opacity: .8; margin-left: 4px; }
  .sym { font: 600 22px/1 ui-monospace, Menlo, monospace; min-width: 68px; }
  .idx { color: var(--muted); font-size: 12px; }
  .fname { font-weight: 600; font-size: 16px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft); margin-left: 6px; }
  .tag.stable { color: var(--ok); } .tag.semi { color: var(--warn); } .tag.unstable { color: var(--bad); }
  .row { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; }
  .lat { flex: none; }
  .desc { font-size: 13.5px; }
  .desc p { margin: 0 0 4px; }
  .desc .k { color: var(--muted); }
  .twelve { margin-top: 10px; padding: 8px 10px; background: var(--soft); border-radius: 10px; font-size: 14px; }
  .twelve b { font-size: 17px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
  td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n12 { font-weight: 600; white-space: nowrap; }
  td.dev { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hn { font-weight: 600; } .fm { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .dev.z { color: var(--ok); } .dev.m { color: var(--warn); } .dev.l { color: var(--bad); }
  details.legend { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  details.legend > summary { cursor: pointer; font-weight: 600; }
  details.legend li { margin: 4px 0; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Semitone</h1>
    <div class="topright">
      <a class="star" id="star" href="https://github.com/Hikari-Tsai/Semitone" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">★</span><span data-i18n="star"></span><span class="count" id="starCount" hidden></span></a>
      <div class="lang" id="lang" role="group" data-i18n-aria="aria.lang"></div>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <section class="controls" data-i18n-aria="aria.settings">
    <div><label for="mode"><span data-i18n="l.mode"></span></label><select id="mode"></select></div>
    <div><label for="len"><span data-i18n="l.len"></span></label>
      <select id="len"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></div>
    <div><label for="tonic"><span data-i18n="l.tonic"></span></label><select id="tonic"></select></div>
    <div><label for="tuning"><span data-i18n="l.tuning"></span></label>
      <select id="tuning"><option value="ji" data-i18n="tuning.ji"></option><option value="edo41" data-i18n="tuning.edo41"></option><option value="edo12" data-i18n="tuning.edo12"></option></select></div>
    <div><label for="instrument"><span data-i18n="l.instrument"></span></label>
      <select id="instrument"><option value="free" data-i18n="inst.free"></option><option value="wind" data-i18n="inst.wind"></option><option value="guitar" data-i18n="inst.guitar"></option><option value="fixed" data-i18n="inst.fixed"></option></select></div>
    <div><label for="timbre"><span data-i18n="l.timbre"></span></label>
      <select id="timbre">
        <optgroup data-i18n-label="tg.dance"><option value="supersaw" data-i18n="tb.supersaw"></option><option value="pluck" data-i18n="tb.pluck"></option><option value="stab" data-i18n="tb.stab"></option><option value="pwm" data-i18n="tb.pwm" selected></option><option value="hoover" data-i18n="tb.hoover"></option><option value="acid" data-i18n="tb.acid"></option></optgroup>
        <optgroup data-i18n-label="tg.pad"><option value="strings" data-i18n="tb.strings"></option><option value="pad" data-i18n="tb.pad"></option><option value="epiano" data-i18n="tb.epiano"></option><option value="bell" data-i18n="tb.bell"></option></optgroup>
        <optgroup data-i18n-label="tg.check"><option value="organ" data-i18n="tb.organ"></option></optgroup>
      </select></div>
    <div><label for="rhythm"><span data-i18n="l.rhythm"></span></label>
      <select id="rhythm"><option value="sustain" data-i18n="rh.sustain"></option><option value="beat" data-i18n="rh.beat"></option><option value="eighth" data-i18n="rh.eighth"></option><option value="offbeat" data-i18n="rh.offbeat"></option><option value="tresillo" data-i18n="rh.tresillo"></option></select></div>
    <div><label for="drums"><span data-i18n="l.drums"></span></label>
      <select id="drums"><option value="none" data-i18n="dr.none"></option><option value="house" data-i18n="dr.house"></option><option value="techno" data-i18n="dr.techno"></option><option value="trance" data-i18n="dr.trance"></option><option value="breaks" data-i18n="dr.breaks"></option><option value="garage" data-i18n="dr.garage"></option><option value="halftime" data-i18n="dr.halftime" selected></option></select></div>
    <div><label for="drumVol"><span data-i18n="l.drumVol"></span></label><input id="drumVol" type="range" min="0" max="100" value="70"></div>
    <div><label for="bpm"><span data-i18n="l.bpm"></span></label>
      <input id="bpm" type="number" min="30" max="300" step="1" value="189"></div>
    <div><label for="sigNum"><span data-i18n="l.sig"></span></label>
      <div class="sig"><input id="sigNum" type="number" min="1" max="16" step="1" value="4" data-i18n-aria="aria.sigNum">
        <span>/</span>
        <select id="sigDen" data-i18n-aria="aria.sigDen"><option>2</option><option selected>4</option><option>8</option><option>16</option></select></div></div>
    <div><label for="bars"><span data-i18n="l.bars"></span><span id="durVal"></span></label>
      <select id="bars"><option value="0.5" data-i18n="bars.half"></option><option value="1" data-i18n="bars.1" selected></option><option value="2" data-i18n="bars.2"></option></select></div>
    <div><label id="optsLabel"><span data-i18n="l.opts"></span></label>
      <div class="checks">
        <label><input type="checkbox" id="oCra" checked> <span data-i18n="o.cra"></span></label>
        <label><input type="checkbox" id="oCrana" checked> <span data-i18n="o.crana"></span></label>
        <label><input type="checkbox" id="oPat" checked> <span data-i18n="o.pat"></span></label>
        <label><input type="checkbox" id="oFar"> <span data-i18n="o.far"></span></label>
        <label><input type="checkbox" id="oArp"> <span data-i18n="o.arp"></span></label>
        <label><input type="checkbox" id="oLoop" checked> <span data-i18n="o.loop"></span></label>
        <label><input type="checkbox" id="oMetro"> <span data-i18n="o.metro"></span></label>
        <label><input type="checkbox" id="oCount"> <span data-i18n="o.count"></span></label>
      </div></div>
  </section>

  <section class="custom" id="customBox">
    <label for="custom"><span data-i18n="l.custom"></span></label>
    <div class="customrow">
      <input id="custom" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="custom.ph">
      <button id="apply" data-i18n="b.apply"></button>
    </div>
    <p class="msg" id="customMsg" aria-live="polite"></p>
  </section>

  <div class="actions genrow">
    <label for="source" class="inline"><span data-i18n="l.source"></span></label>
    <select id="source"><option value="mix" data-i18n="src.mix" selected></option><option value="random" data-i18n="src.random"></option><option value="library" data-i18n="src.library"></option></select>
    <button class="primary" id="gen" data-i18n="b.gen"></button>
  </div>
  <div class="actions playrow">
    <button id="play" data-i18n="b.play"></button>
    <button id="stop" data-i18n="b.stop"></button>
    <button id="export" data-i18n="b.export"></button>
    <span class="kbd" data-i18n="kbd"></span>
    <span class="spacer"></span>
    <button id="toggleAll"></button>
    <button id="reset" data-i18n="b.reset"></button>
  </div>
  <p class="note" id="tlTitle" style="margin:14px 0 -8px"><span data-i18n="tl.title"></span></p>
  <section class="timeline" id="timeline" data-i18n-aria="tl.title"></section>
  <p class="used" id="usedProg" hidden></p>
  <p class="note" data-i18n="note"></p>

  <section class="cards" id="cards"></section>

  <details class="legend">
    <summary data-i18n="legend.title"></summary>
    <ul data-i18n-html="legend.html"></ul>
  </details>

  <footer data-i18n-html="footer.html"></footer>
</main>

<div id="tip" role="tooltip" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="i18n.js"></script>
<script src="theory.js"></script>
<script src="midi.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const DIM_COLOR = { 3: "var(--d3)", 4: "var(--d4)", 5: "var(--d5)" };

// ── 選單 ──
for (const k of Object.keys(MODES)) { const o = new Option("", k); o.dataset.i18n = "mode." + k; $("mode").add(o); }
$("mode").value = "5f"; // 預設：5 次元（作者建議的 AhChyFuzi 配置）
NOTE_NAMES.forEach((n, i) => $("tonic").add(new Option(n, i)));

let state = { seq: [], chords: [], voiced: [], home: [], label: [], open: new Set(), sel: null }; // label = 用到的常見進行 id // sel = 簡圖上選取的和弦
let playToken = 0;

const tonicMidi = () => { const pc = +$("tonic").value; return pc <= 6 ? 48 + pc : 36 + pc; }; // G2–F♯3
const midiToHz = (m) => 440 * 2 ** ((m - 69) / 12);
// 說明用的「目標調律」：選 12 平均律播放時，仍以純正律為目標來說明差距
const targetTuning = () => ($("tuning").value === "edo41" ? "edo41" : "ji");

// ── 產生 ──
function generate() {
  stop();
  const len = +$("len").value, source = $("source").value;
  if (source === "library" || (source === "mix" && Math.random() < 0.5)) {
    const lib = libraryProgression(len); // 從常見進行庫湊出來
    state.seq = lib.seq; state.label = lib.ids;
  } else {
    const opt = { cra: $("oCra").checked, crana: $("oCrana").checked, pat: $("oPat").checked, range: $("oFar").checked ? 2 : 1 };
    state.seq = generateProgression(len, opt); state.label = [];
  }
  setSequence();
}
// 換上一整段新的進行後的共同收尾
function setSequence() {
  state.home = state.seq.map((fn) => ({ ...fn })); // 每個位置原本的機能，用來判斷哪些算「代理」
  state.open.clear();
  state.sel = null;
  rebuild();
  saveState();
}
// ── 自行輸入和弦（3、4 次元） ──
function applyCustom() {
  const text = $("custom").value.trim(), msg = $("customMsg");
  const say = (bad, key, vars) => { msg.classList.toggle("bad", bad); msg.textContent = t(key, vars); };
  if (!text) return say(true, "custom.empty");
  const r = parseProgression(text, +$("tonic").value);
  const problems = [];
  if (r.unknown.length) problems.push(t("custom.unknown", { list: r.unknown.join(" ") }));
  if (r.unsupported.length) problems.push(t("custom.unsupported", { list: r.unsupported.join(" ") }));
  if (!r.seq.length) { msg.classList.add("bad"); msg.textContent = problems.join(" "); return; }
  stop();
  state.seq = r.seq; state.label = [];
  setSequence();
  msg.classList.toggle("bad", problems.length > 0);
  msg.textContent = [t("custom.ok", { n: r.seq.length }), $("mode").value === "4" ? t("custom.translated") : "", ...problems].filter(Boolean).join(" ");
}
function showCustomBox() { $("customBox").hidden = !["3", "4"].includes($("mode").value); }
function rebuild() {
  const G = MODES[$("mode").value].G;
  state.chords = state.seq.map((fn) => buildChord(fn, G));
  state.voiced = voiceProgression(state.chords);
  render();
}

// ── 文字說明 ──
function roleText(fn) {
  if (fn.v === "pat") return t("role.pat");
  if (fn.v === "ta") return t("role.p" + fn.p);
  if (fn.v === "cra") return t("role.cra", { name: POS_NAME[fn.p] });
  if (fn.v === "na") return t("role.na", { name: POS_NAME[fn.p] });
  return fn.p === 0 ? t("role.crana0") : t("role.crana", { name: POS_NAME[fn.p] });
}
function moveText(i) {
  if (i === 0) return "";
  const a = state.chords[i - 1], b = state.chords[i];
  const mv = sub(b.bass, a.bass);
  const prevKeys = new Set(a.tones.map(key));
  const common = b.tones.filter((t) => prevKeys.has(key(t))).map(harmononym);
  const k = kin(mv);
  const moveStr = isZero(mv) ? t("move.still") : t("move.to", { h: harmononym(mv), f: formula(mv), k });
  const link = common.length ? t("move.common", { list: [...new Set(common)].map((n) => "’" + n).join(t("sep")) })
    : t(k <= 2 ? "move.near" : "move.far");
  return `<p><span class="k">${esc(t("move.label"))}</span>${esc(moveStr + t("move.join") + link + t("move.end"))}</p>`;
}

// ── 小格子圖 ──
function latticeSvg(ch, mode) {
  const g = mode.G, gi = g.findIndex((x, i) => i > 0 && x !== 0);
  const cell = 15, cols = 7, rows = 5, x0 = 3, y0 = 2; // 中心 = 主音
  const pos = (v) => ({ x: v[0] + x0, y: y0 - v[gi] });
  let s = `<svg class="lat" width="${cols * cell + 2}" height="${rows * cell + 2}" viewBox="-1 -1 ${cols * cell + 2} ${rows * cell + 2}" role="img" aria-label="${esc(t("aria.lattice"))}">`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    s += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}" fill="none" stroke="var(--line)"/>`;
  s += `<rect x="${x0 * cell + 1.5}" y="${y0 * cell + 1.5}" width="${cell - 3}" height="${cell - 3}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
  const bassKey = key(ch.bass);
  for (const t of ch.tones) {
    const p = pos(t);
    if (p.x < 0 || p.x >= cols || p.y < 0 || p.y >= rows) continue;
    const guest = t[gi] !== 0;
    s += `<rect x="${p.x * cell + 2}" y="${p.y * cell + 2}" width="${cell - 4}" height="${cell - 4}" rx="2" fill="${guest ? DIM_COLOR[mode.dim] : "var(--d2)"}"/>`;
    if (key(t) === bassKey) s += `<path d="M${p.x * cell + 5} ${p.y * cell + 4.5} l5 3 l-5 3 z" fill="#fff"/>`;
  }
  return s + "</svg>";
}

// ── 頂端的進行簡圖 ──
const TL = { step: 64, left: 30, top: 14, rowH: 26, nodeW: 54, nodeH: 20 };
function name12Of(i) {
  const tm = tonicMidi();
  const pcs = state.voiced[i].map((n) => mod(Math.round(tm + 12 * n.log), 12));
  return chordName12(pcs, pcs[0]);
}
function renderTimeline() {
  const n = state.seq.length;
  const ps = state.seq.map((f) => f.p);
  const hi = Math.max(1, ...ps), lo = Math.min(-1, ...ps);
  const rows = hi - lo + 1;
  const W = TL.left + n * TL.step + 6, gridH = rows * TL.rowH, H = TL.top + gridH + 34;
  const cx = (i) => TL.left + i * TL.step + TL.step / 2;
  const cy = (p) => TL.top + (hi - p) * TL.rowH + TL.rowH / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, n * 46)}px" role="img" aria-label="${esc(t("tl.title"))}">`;
  for (let p = hi; p >= lo; p--) {
    s += `<line class="grid ${p === 0 ? "home" : ""}" x1="${TL.left}" x2="${W - 6}" y1="${cy(p)}" y2="${cy(p)}"/>`;
    s += `<text class="rowlab" x="4" y="${cy(p) + 4}">${esc(POS_SYMBOL[p])}</text>`;
  }
  s += `<polyline class="path" points="${state.seq.map((f, i) => `${cx(i)},${cy(f.p)}`).join(" ")}"/>`;
  s += `<line id="ph" x1="0" x2="0" y1="${TL.top - 6}" y2="${TL.top + gridH + 4}" visibility="hidden"/>`;
  state.seq.forEach((f, i) => {
    const x = cx(i), y = cy(f.p);
    s += `<g class="node ${f.v}${state.sel === i ? " sel" : ""}" data-i="${i}"><title>${esc(t("card.chord", { n: i + 1 }))}: ${esc(state.chords[i].name)}</title>
      <rect x="${x - TL.nodeW / 2}" y="${y - TL.nodeH / 2}" width="${TL.nodeW}" height="${TL.nodeH}" rx="6"/>
      <text x="${x}" y="${y + 4.5}">${esc(state.chords[i].symbol)}</text></g>`;
    s += `<text class="n12" data-i="${i}" x="${x}" y="${TL.top + gridH + 16}">${esc(name12Of(i))}</text>`;
    s += `<text class="num" x="${x}" y="${TL.top + gridH + 29}">${i + 1}</text>`;
  });
  if (state.sel != null && state.seq[state.sel]) { // 選取的和弦右上角顯示「換代理和弦」按鈕
    const x = cx(state.sel) + TL.nodeW / 2, y = cy(state.seq[state.sel].p) - TL.nodeH / 2;
    s += `<g class="swapbtn" data-swap="${state.sel}" role="button" tabindex="0" aria-label="${esc(t("card.swap"))}">
      <title>${esc(t("card.swap"))}</title><circle cx="${x}" cy="${y}" r="9.5"/><text x="${x}" y="${y + 4.2}">↻</text></g>`;
  }
  $("timeline").innerHTML = s + "</svg>";
  placeSwapMenu();
  const names = state.label.map((id) => PROG_LIBRARY.find((it) => it.id === id)).filter(Boolean).map((it) => it.name[LANG] || it.name.en);
  $("usedProg").hidden = !names.length;
  $("usedProg").textContent = names.length ? t("used", { list: names.join(" ＋ ") }) : "";
}
// 選取的和弦右下角放一個下拉選單，列出這個位置所有合理的和弦（代理＋其他），可直接挑選
function placeSwapMenu() {
  const i = state.sel, box = $("timeline");
  const node = i == null ? null : box.querySelector(`.node[data-i="${i}"]`);
  if (!node) return;
  const G = MODES[$("mode").value].G, subs = substitutes(i), others = otherOptions(i);
  const label = (fn) => `${buildChord(fn, G).symbol}  ${roughName12(fn)}`;
  const opts = (list, offset) => list.map((fn, j) => `<option value="${offset + j}"${sameFn(fn, state.seq[i]) ? " selected" : ""}>${esc(label(fn))}</option>`).join("");
  const groupName = (k) => esc(t(k).replace(/[：:\s]+$/, ""));
  const all = [...subs, ...others];
  // 目前的和弦若不在候選裡（例如手動輸入的），補一個選項讓選單顯示正確
  const current = all.some((fn) => sameFn(fn, state.seq[i])) ? "" : `<option value="-1" selected>${esc(label(state.seq[i]))}</option>`;
  const wrap = document.createElement("span");
  wrap.className = "tl-menu";
  wrap.innerHTML = `<span aria-hidden="true">▾</span><select aria-label="${esc(t("card.pick"))}" title="${esc(t("card.pick"))}">${current}
    <optgroup label="${groupName("card.subs")}">${opts(subs, 0)}</optgroup>
    ${others.length ? `<optgroup label="${groupName("card.others")}">${opts(others, subs.length)}</optgroup>` : ""}</select>`;
  const r = node.getBoundingClientRect(), b = box.getBoundingClientRect();
  wrap.style.left = (r.right - b.left + box.scrollLeft - 10) + "px";
  wrap.style.top = (r.bottom - b.top + box.scrollTop - 10) + "px";
  wrap.querySelector("select").addEventListener("change", (e) => {
    const fn = all[+e.target.value];
    if (fn) swapChord(i, fn);
  });
  box.appendChild(wrap);
}
// frac：目前播放到第幾個和弦（可帶小數）；null 表示隱藏指針
function setPlayhead(frac) {
  const ph = $("ph");
  if (!ph) return;
  if (frac == null) { ph.setAttribute("visibility", "hidden"); return; }
  const x = TL.left + frac * TL.step;
  ph.setAttribute("x1", x); ph.setAttribute("x2", x); ph.setAttribute("visibility", "visible");
}

// ── 更換單一和弦：這個位置可以換成哪些和弦 ──
// 分兩組：
// 1. 代理：同一個「機能類」。同一個機能位的 ta／cra／crana 功能相同、色彩不同；
//    屬的位置另外可換成挟み打ち [>+<]。
// 2. 其他合理的和弦：不同機能，但與前後和弦接得起來。依原作者的作曲訣竅判斷：
//    與相鄰和弦有共通音，或底音與相鄰底音在 2 親等以內。
const sameFn = (a, b) => !!a && !!b && a.p === b.p && a.v === b.v;
function substitutes(i) {
  const cur = state.home[i], p = cur.v === "pat" ? 1 : cur.p; // 以產生時的和弦為準，輪替時候選清單才不會跟著跑掉
  const list = ["ta", "cra", "crana"].map((v) => ({ p, v }));
  if (p === 1) list.push({ p: 0, v: "pat" });
  return list;
}
// 兩個和弦接不接得起來，以及接得多順（共通音越多、底音越近，分數越高）
function linkScore(a, b) {
  const keys = new Set(a.tones.map(key));
  const common = new Set(b.tones.filter((x) => keys.has(key(x))).map(key)).size;
  const k = kin(sub(b.bass, a.bass));
  return { ok: common > 0 || k <= 2, score: common * 2 - k * 0.5 };
}
function otherOptions(i) {
  const G = MODES[$("mode").value].G;
  const subs = substitutes(i);
  const neighbours = [state.seq[i - 1], state.seq[i + 1]].filter(Boolean).map((fn) => buildChord(fn, G));
  const all = [{ p: 0, v: "pat" }];
  for (let p = -2; p <= 2; p++) for (const v of ["ta", "cra", "crana"]) all.push({ p, v });
  return all
    .filter((fn) => !subs.some((x) => sameFn(x, fn)) && !sameFn(fn, state.seq[i - 1]) && !sameFn(fn, state.seq[i + 1]))
    .map((fn) => { const links = neighbours.map((nb) => linkScore(nb, buildChord(fn, G)));
      return { fn, ok: links.every((l) => l.ok), score: links.reduce((sum, l) => sum + l.score, 0) }; })
    .filter((c) => c.ok)
    .sort((x, y) => y.score - x.score) // 接得最順的排前面
    .map((c) => c.fn);
}
// 全部候選：代理在前，其他合理的和弦在後。↻ 依這個順序輪替
const swapOptions = (i) => [...substitutes(i), ...otherOptions(i)];
// 候選和弦在 12 平均律下最接近的名字（不看實際聲部配置，只看音高類別）
function roughName12(fn) {
  const ch = buildChord(fn, MODES[$("mode").value].G), tm = tonicMidi();
  const pc = (v) => mod(Math.round(tm + 12 * jiClassLog(v)), 12);
  return chordName12(ch.tones.map(pc), pc(ch.bass));
}
function chipHtml(i, j, fn) {
  const G = MODES[$("mode").value].G;
  return `<button type="button" data-sub="${i}:${j}" aria-pressed="${sameFn(fn, state.seq[i])}">${esc(buildChord(fn, G).symbol)}<span class="n12s">${esc(roughName12(fn))}</span></button>`;
}
function subChips(i) {
  const subs = substitutes(i), others = otherOptions(i);
  let h = `<div class="subs"><span class="k">${esc(t("card.subs"))}</span>${helpIcon("subs")}${subs.map((fn, j) => chipHtml(i, j, fn)).join("")}</div>`;
  if (others.length) h += `<div class="subs"><span class="k">${esc(t("card.others"))}</span>${helpIcon("others")}${others.map((fn, j) => chipHtml(i, subs.length + j, fn)).join("")}</div>`;
  return h;
}
// fn 省略時輪替到下一個候選，並盡量避開與前後和弦完全相同的選項
function swapChord(i, fn) {
  if (!fn) {
    const list = swapOptions(i), at = list.findIndex((f) => sameFn(f, state.seq[i]));
    const order = list.map((_, k) => list[(at + 1 + k) % list.length]).filter((f) => !sameFn(f, state.seq[i]));
    fn = order.find((f) => !sameFn(f, state.seq[i - 1]) && !sameFn(f, state.seq[i + 1])) || order[0];
  }
  if (!fn || sameFn(fn, state.seq[i])) return;
  state.seq[i] = fn;
  rebuild(); // 聲部配置與前後和弦有關，整段重算
  saveState();
  audition(i);
}

// ── 畫面 ──
function render() {
  const mode = MODES[$("mode").value], inst = $("instrument").value, tt = targetTuning(), tm = tonicMidi();
  renderTimeline();
  $("toggleAll").textContent = t(state.open.size === state.chords.length ? "b.collapse" : "b.expand");
  $("cards").innerHTML = state.chords.map((ch, i) => {
    const notes = state.voiced[i];
    const rows = notes.map((n) => {
      const target = tm + 12 * tunedLog(n, tt);
      const n12 = nearest12(target);
      const a = Math.abs(n12.dev), cls = a < 5 ? "z" : a < 25 ? "m" : "l";
      const rc = ratioClass(n.vec);
      const devStr = a < 0.5 ? "0" : (n12.dev > 0 ? "+" : "−") + a.toFixed(0);
      return `<tr>
        <td><span class="hn">’${esc(harmononym(n.vec))}</span>${n.isBass ? ` <span class='fm'>${esc(t("card.bass"))}</span>` : ""}<br>
            <span class="fm">${esc(formula(n.vec))}・${rc.num}/${rc.den}・41#${edo41Step(n.vec)}′</span></td>
        <td class="n12">${esc(n12.name)}</td>
        <td class="dev ${cls}">${devStr}¢</td>
        <td>${esc(howTo(n12.dev, n12, inst))}</td></tr>`;
    }).join("");
    const pcs = notes.map((n) => mod(Math.round(tm + 12 * n.log), 12));
    const name12 = chordName12(pcs, pcs[0]);
    const maxDev = Math.max(...notes.map((n) => Math.abs(nearest12(tm + 12 * tunedLog(n, tt)).dev)));
    const verdict = t(maxDev < 5 ? "v.exact" : maxDev < 25 ? "v.close" : maxDev < 40 ? "v.approx" : "v.none");
    const st = stability(ch);
    return `<details class="card" data-i="${i}" ${state.open.has(i) ? "open" : ""}>
      <summary>
        <div class="sym">${esc(ch.symbol)}</div>
        <div class="sumtxt"><div class="idx">${esc(t("card.chord", { n: i + 1 }))}・${esc(t("card.approx", { name: name12 }))}</div>
          <div class="fname">${esc(ch.name)}<span class="tag ${st}">${esc(t("st." + st))}</span>${helpIcon("stability")}</div></div>
        <button class="aud" data-swap="${i}" title="${esc(t("card.swap"))}" aria-label="${esc(t("card.swap"))}">↻</button>
        <button class="aud" data-i="${i}" aria-label="${esc(t("aria.audition", { n: i + 1 }))}">▶</button>
      </summary>
      <div class="body">
        <div class="fm">${esc(ch.chordonym)}</div>
        <div class="row">${latticeSvg(ch, mode)}
          <div class="desc"><p>${esc(roleText(state.seq[i]))}</p>${moveText(i)}</div></div>
        ${subChips(i)}
        <div class="twelve">${esc(t("card.closest"))}<b>${esc(name12)}</b>${maxDev >= 40 ? esc(t("card.refOnly")) : ""}<br>${esc(verdict)}</div>
        <table><thead><tr><th>${esc(t("th.note"))}${helpIcon("colNote")}</th><th>${esc(t("th.12"))}</th><th>${esc(t("th.dev"))}${helpIcon("colDev")}</th><th>${esc(t("th.how"))}</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </details>`;
  }).join("");
  if (nowPlaying >= 0) mark(nowPlaying); // 播放中重畫時補回反白
}

// ── 合成器（Tone.js） ──
// 每個音色 = 一個 PolySynth + 一串效果器。fx 依序串接，最後進殘響。
// 注意：疊多個失諧振盪器的音色（Supersaw、Hoover）本身就有幾十音分的搖晃，會蓋掉純正律的細微差別。
const adsr = (attack, decay, sustain, release) => ({ attack, decay, sustain, release });
const lowpass = (freq, Q = 0.7) => new Tone.Filter({ type: "lowpass", frequency: freq, Q });
const chorus = (rate, depth, wet) => new Tone.Chorus({ frequency: rate, delayTime: 3.5, depth, wet }).start();
const PRESETS = {
  organ: () => ({ vol: -12, wet: 0.16,
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sine6" }, envelope: adsr(0.03, 0.3, 0.7, 1.1) }) }),
  pad: () => ({ vol: -15, wet: 0.2,
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: adsr(0.08, 0.3, 0.7, 1.1) }) }),
  epiano: () => ({ vol: -9, wet: 0.16,
    synth: new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 1.4,
      envelope: adsr(0.005, 0.7, 0.25, 1.2), modulationEnvelope: adsr(0.005, 0.4, 0.1, 0.8) }) }),
  bell: () => ({ vol: -11, wet: 0.3,
    synth: new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3.01, modulationIndex: 9,
      envelope: adsr(0.001, 1.4, 0, 1.4), modulationEnvelope: adsr(0.001, 0.5, 0, 0.5) }) }),
  strings: () => ({ vol: -17, wet: 0.3, fx: [lowpass(2600), chorus(0.6, 0.5, 0.4)],
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 3, spread: 14 },
      envelope: adsr(0.35, 0.4, 0.8, 1.6) }) }),
  // 七個失諧鋸齒波疊在一起，Trance 與 EDM 的主和弦音色
  supersaw: () => ({ vol: -20, wet: 0.24, fx: [lowpass(6500), chorus(1.2, 0.35, 0.3)],
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 7, spread: 32 },
      envelope: adsr(0.01, 0.25, 0.75, 0.5) }) }),
  // 濾波器快速關閉的短音，適合搭配八分音符或 3-3-2
  pluck: () => ({ vol: -10, wet: 0.26,
    synth: new Tone.PolySynth(Tone.MonoSynth, { oscillator: { type: "fatsawtooth", count: 3, spread: 18 },
      filter: { type: "lowpass", Q: 2, rolloff: -24 },
      filterEnvelope: { attack: 0.001, decay: 0.22, sustain: 0.08, release: 0.25, baseFrequency: 280, octaves: 4.2 },
      envelope: adsr(0.002, 0.3, 0.12, 0.3) }) }),
  // 方波加一點濾波包絡的和弦短擊，適合反拍
  stab: () => ({ vol: -17, wet: 0.2, fx: [chorus(0.8, 0.3, 0.2)],
    synth: new Tone.PolySynth(Tone.MonoSynth, { oscillator: { type: "fatsquare", count: 3, spread: 12 },
      filter: { type: "lowpass", Q: 1.2, rolloff: -24 },
      filterEnvelope: { attack: 0.002, decay: 0.14, sustain: 0.35, release: 0.2, baseFrequency: 700, octaves: 3 },
      envelope: adsr(0.003, 0.18, 0.5, 0.18) }) }),
  pwm: () => ({ vol: -20, wet: 0.26, fx: [lowpass(4200), chorus(0.5, 0.6, 0.45)],
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "pwm", modulationFrequency: 0.45 },
      envelope: adsr(0.04, 0.3, 0.7, 0.9) }) }),
  // 失諧很寬的鋸齒波加上共振濾波
  hoover: () => ({ vol: -20, wet: 0.2, fx: [lowpass(3800, 3), chorus(2.5, 0.8, 0.5)],
    synth: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 5, spread: 55 },
      envelope: adsr(0.04, 0.2, 0.85, 0.35) }) }),
  acid: () => ({ vol: -26, wet: 0.14,
    synth: new Tone.PolySynth(Tone.MonoSynth, { oscillator: { type: "square" },
      filter: { type: "lowpass", Q: 7, rolloff: -24 },
      filterEnvelope: { attack: 0.002, decay: 0.2, sustain: 0.15, release: 0.15, baseFrequency: 220, octaves: 3.6 },
      envelope: adsr(0.002, 0.2, 0.45, 0.12) }) }),
};

let synth = null, synthKind = null, synthFx = [], reverb = null;
function disposeSynth() {
  if (!synth) return;
  synth.releaseAll();
  synth.dispose(); // 連同已排程但還沒發聲的音一起取消
  synthFx.forEach((n) => n.dispose());
  synth = null; synthFx = [];
}
function getSynth() {
  const kind = $("timbre").value;
  if (synth && kind === synthKind) return synth;
  disposeSynth();
  if (!reverb) reverb = new Tone.Reverb({ decay: 2.4, wet: 0.16 }).toDestination();
  const p = PRESETS[kind]();
  synth = p.synth; synthFx = p.fx || []; synthKind = kind;
  synth.volume.value = p.vol;

const DRUM_PATTERNS = {

  techno:   { kick: "x...x...x...x...", clap: "............x...", hat: "xxxxxxxxxxxxxxxx", open: "..x...x...x...x." },
  trance:   { kick: "x...x...x...x...", clap: "....x.......x...", hat: "................", open: "..x...x...x...x." },
  breaks:   { kick: "x.........x.....", clap: "....x.......x...", hat: "x.x.x.x.x.x.x.x.", open: "................" },
  garage:   { kick: "x......x..x.....", clap: "....x.......x...", hat: "x..x..x.x..x..x.", open: "................" },
  halftime: { kick: "x.....x.........", clap: "........x.......", hat: "x.x.x.x.x.xxx.x.", open: "................" },

  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    moveChordTo(i, state.seq[i].p + (e.key === "ArrowUp" ? 1 : -1));
  } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const j = i + (e.key === "ArrowRight" ? 1 : -1);
    if (j < 0 || j >= state.seq.length) return;
    state.sel = j;
    renderTimeline();
    $("timeline").querySelector(`.node[data-i="${j}"]`)?.scrollIntoView({ block: "nearest", inline: "nearest" });
    audition(j);
  } else if (e.key === "Escape") { state.sel = null; renderTimeline(); }
});
window.addEventListener("resize", () => { if (state.sel != null) renderTimeline(); }); // 選單是疊在圖上的，視窗大小改變要重新定位
$("timeline").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.closest(".swapbtn")) {
    e.preventDefault();
    const i = +e.target.closest(".swapbtn").dataset.swap;
    swapChord(i);
    document.querySelector(".timeline .swapbtn")?.focus(); // 重畫後把焦點放回按鈕，方便連續按
  }
});

// ── GitHub 星星數 ──
// 用 GitHub 公開 API 查詢（不需登入，每個 IP 每小時 60 次）。結果暫存 10 分鐘，查不到時只顯示按鈕、不顯示數字。
const REPO = "Hikari-Tsai/Semitone";
async function loadStars() {
  const show = (n) => { $("starCount").textContent = n.toLocaleString(); $("starCount").hidden = false; };
  try {
    const c = JSON.parse(sessionStorage.getItem("semitone.stars") || "null");
    if (c && Date.now() - c.at < 600000) return show(c.n);
  } catch (e) { /* 無法讀取暫存時直接查詢 */ }
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) return;
    const n = (await res.json()).stargazers_count;
    if (typeof n !== "number") return;
    show(n);
    try { sessionStorage.setItem("semitone.stars", JSON.stringify({ n, at: Date.now() })); } catch (e) { /* 略過 */ }
  } catch (e) { /* 離線或被擋時不顯示數字 */ }
}
loadStars();

// ── 語言切換 ──
function applyLang() {
  applyStaticText();
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.querySelectorAll(".help[data-help]").forEach((h) => h.setAttribute("aria-label", t("aria.help")));
  showDur();
  $("customMsg").textContent = "";
  if (state.chords.length) render(); // 字卡與簡圖的文字是動態產生的，要重畫
}
$("lang").innerHTML = Object.entries(LANGS).map(([k, name]) => `<button type="button" data-lang="${k}" lang="${HTML_LANG[k]}">${name}</button>`).join("");
$("lang").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  setLang(b.dataset.lang);
  applyLang();
});
applyLang();

// ── 記住上次的設定與進行 ──
// 存在瀏覽器的 localStorage（只留在這台裝置的這個瀏覽器裡，不會傳到任何伺服器）。
const FIELDS = ["mode", "len", "source", "custom", "tonic", "tuning", "instrument", "timbre", "rhythm", "drums", "drumVol", "bpm", "sigNum", "sigDen", "bars"];
const CHECKS = ["oCra", "oCrana", "oPat", "oFar", "oArp", "oLoop", "oMetro", "oCount"];
const STORE_KEY = "semitone.state";
function readSettings() {
  const o = {};
  for (const id of FIELDS) o[id] = $(id).value;
  for (const id of CHECKS) o[id] = $(id).checked;
  return o;
}
function writeSettings(o) {
  for (const id of FIELDS) {
    if (typeof o[id] !== "string") continue;
    $(id).value = o[id];
    if ($(id).tagName === "SELECT" && $(id).value !== o[id]) $(id).value = DEFAULTS[id]; // 選項已不存在時退回預設
  }
  for (const id of CHECKS) if (typeof o[id] === "boolean") $(id).checked = o[id];
}
const DEFAULTS = readSettings(); // 此時畫面上還是出廠預設值，先記下來給「恢復預設值」用
const validFn = (f) => f && Number.isInteger(f.p) && Math.abs(f.p) <= 3 && ["ta", "cra", "crana", "na", "pat"].includes(f.v);
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, settings: readSettings(), seq: state.seq, home: state.home, label: state.label }));
  } catch (e) { /* 無法寫入（例如無痕模式）時略過 */ }
}
// 成功還原上次的進行時回傳 true
function restoreState() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return false; }
  if (!saved || saved.v !== 1 || !saved.settings) return false;
  writeSettings(saved.settings);
  showDur();
  showCustomBox();
  if (!Array.isArray(saved.seq) || !saved.seq.length || !saved.seq.every(validFn)) return false;
  state.seq = saved.seq.map((f) => ({ p: f.p, v: f.v }));
  const home = Array.isArray(saved.home) && saved.home.length === state.seq.length && saved.home.every(validFn) ? saved.home : state.seq;
  state.home = home.map((f) => ({ p: f.p, v: f.v }));
  state.label = Array.isArray(saved.label) ? saved.label.filter((x) => typeof x === "string") : [];
  rebuild();
  return true;
}
function resetDefaults() {
  writeSettings(DEFAULTS);
  showDur();
  showCustomBox();
  $("customMsg").textContent = "";
  generate(); // 用預設值重新生成，並覆蓋掉先前儲存的內容
}
document.querySelector(".controls").addEventListener("input", saveState);
document.querySelector(".controls").addEventListener("change", saveState);
$("custom").addEventListener("input", saveState);
$("source").addEventListener("change", saveState); // 生成方式不在設定區內，另外監聽
$("reset").onclick = resetDefaults;

showCustomBox();
if (!restoreState()) generate();
</script>
